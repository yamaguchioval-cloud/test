<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>sheet2gmap</title>
    <style>
      #map {
        height: 100%;
      }
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
#sidebar {
  position: absolute;
  top: 10%;
  left: 72%;
  width: 25%;
  height: 40%; /* ←高さを決めているのでここに収まらないときスクロール */
  border: 1px solid #666;
  padding: 6px;
  background-color: white;
  font-family: "Meiryo UI", sans-serif;
  font-size: 14px;

  overflow-y: auto;   /* 縦スクロール */
  overflow-x: hidden; /* 横スクロールは不要なら隠す */
}

    </style>
  </head>
  <body>
    <div id="map"></div>
    <td><div id="sidebar"></div></td>
    <script src="constants.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?language=ja&region=JP&key=AIzaSyCIVE--9r9iYh6Iu3alGQuXGrrnstpDrws&callback=initMap" async defer></script>
    <script>
      var map;
      var marker = [];
      var infoWindow = [];
      var windowOpened;
      const API_KEY = "AIzaSyCIVE--9r9iYh6Iu3alGQuXGrrnstpDrws";
      const SHEET_ID = "1WoFjEdm9_8sKweW4JZd1u9lr9RQdLO6rm4XpX6xsScc";

      function parseData(data) {
        var keys = data.values[0];
        var markerData = [];
        data.values.forEach(function(value, i) {
          if (i > 0) {
            var hash = {};
            value.forEach(function(d, j) {
              hash[keys[j]] = d;
            });
            markerData.push(hash);
          }
        });
        return markerData;
      }

      function initMap() {
        var target = document.getElementById('map');
        var centerp = {lat: 35.6679191, lng: 139.4606805};

        map = new google.maps.Map(target, {
          center: centerp,
          zoom: 7,
        });

        var request = new XMLHttpRequest();
        request.open('GET', `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/sheet1?key=${API_KEY}`, true);
        request.responseType = 'json';

        request.onload = function () {
          var data = this.response;
          var markerData = parseData(data);
          setData(markerData);
        };

        request.send();
      }
function addMarker(i, data) {
  const lat = Number(data['緯度']);
  const lng = Number(data['経度']);
  if (Number.isNaN(lat) || Number.isNaN(lng)) return;

  const pos = new google.maps.LatLng({lat, lng});
  marker[i] = new google.maps.Marker({
    position: pos,
    map: map,
    title: data['名称'] || ''
  });

  // 名称と担当者を並べる
  const name = data['名称'] || '名称不明';
  const person = data['担当者'] 
    ? `<span style="color:#666; margin-left:8px; font-size:14px;">(${data['担当者']})</span>` 
    : '';

  const summary = data['概要']
    ? `<div style="margin-top:6px; max-height:120px; overflow-y:auto;">${data['概要']}</div>`
    : '';

  const info = `
    <div style="font-size:16px;font-weight:bold;margin-bottom:6px;">
      ${name} ${person}
    </div>
    ${summary}
  `;

  infoWindow[i] = new google.maps.InfoWindow({
    content: info,
    maxWidth: 300
  });

  markerEvent(i);
}


      function setData(markerData){
        var sidebar_html = "";
        for (var i = 0; i < markerData.length; i++) {
          var latitude = markerData[i]['緯度'];
          if (!latitude) { continue; }
          addMarker(i, markerData[i]);
          var name = markerData[i]['名称'];
          
          // 追加：安全のための簡易エスケープ（まだ無ければファイルのどこかに置いてください）
          function escapeHtml(s){
            return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
          }
          
          // ……setData内のループの該当行を次に差し替え……
          const person = markerData[i]['担当者']
            ? ` <span style="color:#666;font-size:12px;">（${escapeHtml(markerData[i]['担当者'])}）</span>`
            : '';
          
          const preview = markerData[i]['概要']
            ? `<div style="color:#666;font-size:12px;margin:2px 0 6px 1.6em;">
                 ${escapeHtml(String(markerData[i]['概要']).slice(0,60))}…
               </div>`
            : '';
          
          sidebar_html += `
            <div style="margin-bottom:6px;">
              <b>${i + 1}</b>
              <a href="javascript:openWindow(${i})">${escapeHtml(name)}</a>${person}
              ${preview}
            </div>`;

        }

        document.getElementById("sidebar").innerHTML = `<a target="_blank" href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?usp=sharing">元データ(Google スプレッドシート)</a><br /><br />` + sidebar_html;
      }

      function markerEvent(i) {
        marker[i].addListener('click', function() {
          openWindow(i);
        });
      }

      function openWindow(i) {
        if(windowOpened){
          windowOpened.close();
        }
        infoWindow[i].open(map, marker[i]);
        windowOpened = infoWindow[i];
      }
    </script>
  </body>
</html>
